<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sneaker Market</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>sneakers</h1>
        <nav>
            <a href="#">Collections</a>
            <a href="#">Men</a>
            <a href="#">Women</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
        <div class="cart-icon"> 🛒</div>
    </header>
    <main>
        <div class="product-container">
            <div class="product-gallery">
            <img src="images/ayaqqabi.jpg.avif" alt="Sneakers">
             <div class="thumbnails">
                <img src="images/ayaqqabi.jpg.avif" alt="Sneakers 1">
                <img src="images/ayaqqabi2.jpg.avif" alt="Sneakers 2">
                <img src="images/ayaqqabi3.jpg.jpg" alt="Sneakers 3">
                <img src="images/ayaqqabi4.jpg.jpg" alt="Sneakers 4">
             </div>
            </div>
         <div class="product-info">
            <h4 class="company-name">SNEAKER COMPANY</h4>
            <h2>Fall Limited Edition Sneakers</h2>
            <p>Theese low-profile sneakers are your perfect casual wear companion.Featuring a durable rubber outer sole,they'll withstand everything the weather can offer.</p>
              
            <div class="price">
            <h3>$125.00</h3>
            <span>50%</span>
            </div>
          <p class="old-price">$250.00</p>
          
           <div class="cart-actions">
              <div class="quantity">
                <button class="quantity-button" id="minus-btn">-</button>
                <span id="quantity-value">0</span>
                <button class="quantity-button" id="plus-btn">+</button>
              </div>
              <button type="submit">🛒 Add to Cart</button>
            </div>  
         </div>   
        </div>
    </main>
  <script src="script.js"></script>  
</body>
</html>
